name: Native Android preview build
on:
  pull_request:
    paths:
      - 'native-prototype/**'
      - '.github/workflows/native-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test native preview
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p native-prototype :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: HunmengNative-v0.1-debug
          path: native-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
