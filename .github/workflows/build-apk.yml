name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Достать ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Нет секрета KEYSTORE_BASE64: собираю ТЕСТОВЫЙ APK с временной подписью. Он не встанет поверх другой версии."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hunmeng-novel.keystore"
          echo "HUNMENG_KEYSTORE=$RUNNER_TEMP/hunmeng-novel.keystore" >> "$GITHUB_ENV"

      - name: Собрать APK
        env:
          HUNMENG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Переименовать APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="HunmengNovel-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Выложить APK в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.name }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
              --title "Hunmeng Novel $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          if [ -z "$HUNMENG_KEYSTORE" ]; then
            gh release edit "$TAG" --prerelease \
              --notes "ТЕСТОВАЯ сборка (временная подпись, коммит ${GITHUB_SHA::7}). Следующая версия не встанет поверх неё — перед установкой новой эту нужно удалить."
          else
            gh release edit "$TAG" --prerelease=false --notes-file RELEASE_NOTES.md
          fi
