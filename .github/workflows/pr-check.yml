name: Android PR build check

on:
  pull_request:
    paths:
      - 'app/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android runner already provides the SDK tooling.
      # Gradle installs the compileSdk platform when necessary.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile debug APK (no release published)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
